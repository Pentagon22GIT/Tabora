name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check shell syntax
        run: for script in Scripts/*.sh; do zsh -n "$script" || exit 1; done

      - name: Run tests
        run: swift test

      - name: Build Community edition
        run: ./Scripts/build-community.sh

      - name: Verify Community identity
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' 'build/community/Tabora Community.app/Contents/Info.plist')" = "dev.pent.Tabora.community"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' 'build/community/Tabora Community.app/Contents/Info.plist')" = "Tabora Community"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' 'build/community/Tabora Community.app/Contents/Info.plist')" = "Tabora"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'build/community/Tabora Community.app/Contents/Info.plist')" = "$(cat VERSION)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :TaboraSourceRevision' 'build/community/Tabora Community.app/Contents/Info.plist')" = "$(git rev-parse HEAD)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :TaboraSourceDirty' 'build/community/Tabora Community.app/Contents/Info.plist')" = "false"
          codesign --verify --strict --verbose=2 'build/community/Tabora Community.app'
